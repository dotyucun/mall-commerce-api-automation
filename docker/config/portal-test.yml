server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${MALL_MYSQL_PASSWORD}
  data:
    mongodb:
      host: mongo
      port: 27017
      database: mall-port
    redis:
      host: redis
      port: 6379
      database: 0
      timeout: 300ms
  rabbitmq:
    host: rabbitmq
    port: 5672
    virtual-host: /mall
    username: mall
    password: ${MALL_RABBITMQ_PASSWORD}

logging:
  level:
    root: info
    com.macro.mall: info

logstash:
  host: localhost
  enableInnerLog: false

alipay:
  gatewayUrl: https://example.invalid
  appId: unused
  alipayPublicKey: unused
  appPrivateKey: unused
  returnUrl: http://localhost
  notifyUrl: http://localhost
