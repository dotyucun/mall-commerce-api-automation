name: RabbitMQ Slow Regression

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 1"

permissions:
  contents: read

env:
  MALL_ADMIN_PASSWORD: ${{ secrets.MALL_ADMIN_PASSWORD }}
  MALL_TEST_USER_A_PASSWORD: ${{ secrets.MALL_TEST_USER_A_PASSWORD }}
  MALL_TEST_USER_B_PASSWORD: ${{ secrets.MALL_TEST_USER_B_PASSWORD }}
  MALL_MYSQL_PASSWORD: ${{ secrets.MALL_MYSQL_PASSWORD }}
  MALL_RABBITMQ_PASSWORD: ${{ secrets.MALL_RABBITMQ_PASSWORD }}
  MALL_SOURCE_DIR: ${{ github.workspace }}/.sut/mall
  PYTHONUTF8: "1"

jobs:
  timeout-cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install -r requirements.txt
      - name: Build and start real mall services
        shell: pwsh
        run: ./scripts/mall-test.ps1 bootstrap
      - name: Verify RabbitMQ delayed cancellation
        run: python -m pytest -m slow
      - name: Capture container logs
        if: always()
        run: |
          mkdir -p reports/logs
          docker compose -f docker/compose.test.yml logs --no-color > reports/logs/compose.log
      - name: Upload evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rabbitmq-slow-evidence
          path: reports
          retention-days: 14
      - name: Stop environment
        if: always()
        run: docker compose -f docker/compose.test.yml down --volumes --remove-orphans
