name: Locust Performance Baseline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "基线或独立阶梯实验（不同运行环境的数字不可混用）"
        required: true
        default: baseline
        type: choice
        options: [baseline, smoke, explore, confirm]

permissions:
  contents: read

env:
  MALL_ADMIN_PASSWORD: ${{ secrets.MALL_ADMIN_PASSWORD }}
  MALL_TEST_USER_A_PASSWORD: ${{ secrets.MALL_TEST_USER_A_PASSWORD }}
  MALL_TEST_USER_B_PASSWORD: ${{ secrets.MALL_TEST_USER_B_PASSWORD }}
  MALL_MYSQL_PASSWORD: ${{ secrets.MALL_MYSQL_PASSWORD }}
  MALL_RABBITMQ_PASSWORD: ${{ secrets.MALL_RABBITMQ_PASSWORD }}
  MALL_SOURCE_DIR: ${{ github.workspace }}/.sut/mall
  PYTHONUTF8: "1"

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install -r requirements.txt
      - name: Build and start real mall services
        shell: pwsh
        run: ./scripts/mall-test.ps1 bootstrap
      - name: Run selected read-only experiment
        shell: pwsh
        env:
          PERFORMANCE_MODE: ${{ inputs.mode }}
        run: |
          if ($env:PERFORMANCE_MODE -eq "baseline") {
            ./scripts/mall-test.ps1 performance
          } else {
            ./scripts/mall-test.ps1 performance-steps -PerformanceProfile $env:PERFORMANCE_MODE
          }
      - name: Capture container logs
        if: always()
        run: |
          mkdir -p reports/logs
          docker compose -f docker/compose.test.yml logs --no-color > reports/logs/compose.log
      - name: Upload Locust report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-performance-baseline
          path: |
            reports/locust
            reports/logs
          retention-days: 14
      - name: Stop environment
        if: always()
        run: docker compose -f docker/compose.test.yml down --volumes --remove-orphans
