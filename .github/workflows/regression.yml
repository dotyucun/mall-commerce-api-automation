name: API Regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MALL_ADMIN_PASSWORD: ${{ secrets.MALL_ADMIN_PASSWORD }}
  MALL_TEST_USER_A_PASSWORD: ${{ secrets.MALL_TEST_USER_A_PASSWORD }}
  MALL_TEST_USER_B_PASSWORD: ${{ secrets.MALL_TEST_USER_B_PASSWORD }}
  MALL_MYSQL_PASSWORD: ${{ secrets.MALL_MYSQL_PASSWORD }}
  MALL_RABBITMQ_PASSWORD: ${{ secrets.MALL_RABBITMQ_PASSWORD }}
  MALL_SOURCE_DIR: ${{ github.workspace }}/.sut/mall
  PYTHONUTF8: "1"

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Static quality checks
        run: |
          ruff check .
          ruff format --check .
          python -m pytest --collect-only -q
      - name: Build and start real mall services
        shell: pwsh
        run: ./scripts/mall-test.ps1 bootstrap
      - name: Run pull-request regression
        run: python -m pytest -m "not slow"

      - name: Generate Allure HTML
        if: always()
        run: |
          curl -fsSL -o /tmp/allure.tgz https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -xzf /tmp/allure.tgz -C /tmp
          /tmp/allure-2.24.0/bin/allure generate reports/allure-results -o reports/allure-report --clean
      - name: Capture service logs
        if: always()
        run: |
          mkdir -p reports/logs
          docker compose -f docker/compose.test.yml logs --no-color > reports/logs/compose.log
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-regression-evidence
          path: |
            reports/allure-results
            reports/allure-report
            reports/logs
          retention-days: 14
      - name: Stop environment
        if: always()
        run: docker compose -f docker/compose.test.yml down --volumes --remove-orphans
